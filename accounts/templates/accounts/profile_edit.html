{% extends 'base.html' %}

{% block title %}Modifier mon Profil - RestoCafe{% endblock %}

{% block content %}
    <div style="max-width: 600px; margin: 30px auto; background: #ffffff; border: 1px solid #e1e8ed; border-radius: 10px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.04);">
        
        <h2 style="color: #2c3e50; margin-top: 0; margin-bottom: 20px; font-size: 24px;">✏️ Modifier mon Profil</h2>

        <!-- ATTENTION : enctype="multipart/form-data" est obligatoire pour envoyer une photo -->
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; color: #34495e; margin-bottom: 8px;">Nom d'utilisateur :</label>
                <input type="text" name="username" value="{{ user.username }}" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; color: #34495e; margin-bottom: 8px;">Adresse Email :</label>
                <input type="email" name="email" value="{{ user.email|default:'' }}" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; color: #34495e; margin-bottom: 8px;">Numéro de téléphone :</label>
                <input type="text" name="tel" value="{{ user.tel|default:'' }}" placeholder="Ex: +216 20 000 000" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; color: #34495e; margin-bottom: 8px;">Photo de profil :</label>
                {% if user.photo %}
                    <div style="margin-bottom: 10px;">
                        <img src="{{ user.photo.url }}" alt="Actuelle" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover;">
                        <span style="font-size: 13px; color: #7f8c8d; margin-left: 10px;">Photo actuelle</span>
                    </div>
                {% endif %}
                <input type="file" name="photo" accept="image/*" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #fdfdfd;">
            </div>

            <div style="margin-bottom: 25px;">
                <label style="display: block; font-weight: bold; color: #34495e; margin-bottom: 8px;">Rôle dans le système :</label>
                <input type="text" value="{{ user.get_role_display }}" disabled style="width: 100%; padding: 10px; background: #f1f1f1; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; color: #7f8c8d; box-sizing: border-box;">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f1f1f1; padding-top: 20px;">
                <a href="{% url 'accounts:profile' %}" style="color: #7f8c8d; text-decoration: none; font-size: 14px; font-weight: 500;">
                    Annuler
                </a>
                
                <button type="submit" style="padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer;">
                    Enregistrer
                </button>
            </div>
        </form>

    </div>
{% endblock %}
