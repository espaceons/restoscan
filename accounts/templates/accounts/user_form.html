{% extends 'base.html' %}

{% block title %}Modifier l'utilisateur{% endblock %}

{% block content %}
    <h2>Modifier l'utilisateur : {{ object.username }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enregistrer les modifications</button>
    </form>
    <br>
    <a href="{% url 'accounts:user_list' %}">Retour à la liste</a>
{% endblock %}
