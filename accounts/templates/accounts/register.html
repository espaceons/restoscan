{% extends 'base.html' %}

{% block title %}Ajouter un utilisateur{% endblock %}

{% block content %}
    <h2>Ajouter un utilisateur (Serveur / Cuisinier / Admin)</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Créer l'utilisateur</button>
    </form>
    <br>
    <a href="{% url 'accounts:user_list' %}">Retour à la liste</a>
{% endblock %}
