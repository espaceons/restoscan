{% extends 'base.html' %}

{% block title %}Connexion - RestoCafe{% endblock %}

{% block content %}
    <div style="max-width: 400px; margin: auto; padding: 20px;">
        <h2>Connexion</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Se connecter</button>
        </form>

        <!-- Lien pour une nouvelle inscription -->
        <div style="margin-top: 20px; text-align: center;">
            <p>Vous n'avez pas de compte ? <a href="{% url 'accounts:register' %}">Nouvelle inscription</a></p>
        </div>
    </div>
{% endblock %}
