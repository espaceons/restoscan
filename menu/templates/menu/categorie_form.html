{% extends 'base.html' %}

{% block title %}Formulaire Catégorie - RestoCafe{% endblock %}

{% block content %}
    <div style="max-width: 600px; margin: 30px auto; background: #ffffff; border: 1px solid #e1e8ed; border-radius: 10px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.04);">
        
        <h2 style="color: #2c3e50; margin-top: 0; margin-bottom: 20px; font-size: 24px;">
            📁 Ajouter une nouvelle catégorie
        </h2>

        <form method="post" style="margin-top: 20px;">
            {% csrf_token %}
            
            <div style="margin-bottom: 15px;">
                {{ form.as_p }}
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 25px;">
                <button type="submit" style="padding: 10px 22px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer;">
                    Enregistrer
                </button>
                
                <a href="{% url 'menu:categorie_list' %}" style="color: #7f8c8d; text-decoration: none; font-size: 14px; font-weight: 500;">
                    Annuler
                </a>
            </div>
        </form>

    </div>
{% endblock %}
