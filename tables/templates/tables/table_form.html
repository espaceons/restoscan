{% extends 'base.html' %}

{% block title %}Formulaire Table - RestoCafe{% endblock %}

{% block content %}
    <h2>{% if object %}Modifier la Table {{ object.numero }}{% else %}Ajouter une nouvelle Table{% endif %}</h2>
    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="padding: 10px 20px; background: #2980b9; color: white; border: none; border-radius: 4px; cursor: pointer;">Enregistrer</button>
    </form>
    <br>
    <a href="{% url 'tables:table_list' %}">Retour à la liste des tables</a>
{% endblock %}
