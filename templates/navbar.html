<nav style="background: #333; color: #fff; padding: 15px; margin-bottom: 20px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">
    <div>
        <strong style="font-size: 18px;">RestoCafe</strong> |
        <a href="{% url 'accounts:home' %}" style="color: #fff; text-decoration: none; margin: 0 10px;">Accueil</a>
        {% if user.is_authenticated %}
            | <a href="{% url 'accounts:user_list' %}" style="color: #fff; text-decoration: none; margin: 0 10px;">Utilisateurs</a>
        {% endif %}
    </div>

    <div>
        {% if user.is_authenticated %}
            <span style="color: #4CAF50; margin-right: 15px;">Connecté : <strong>{{ user.username }}</strong> ({{ user.get_role_display }})</span>
            
            <!-- Formulaire POST obligatoire pour la déconnexion dans Django -->
            <form action="{% url 'accounts:logout' %}" method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" style="background: #c0392b; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Se déconnecter</button>
            </form>
        {% else %}
            <span style="color: #e74c3c; margin-right: 15px;">Pas d'accès (Non connecté)</span>
            <a href="{% url 'accounts:login' %}" style="color: #fff; text-decoration: none; padding: 5px 10px; background: #2980b9; border-radius: 4px;">Connexion</a>
        {% endif %}
    </div>
</nav>
