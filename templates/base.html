<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RestoCafe{% endblock %}</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f9f9f9; 
            color: #333;
        }
        .container { 
            background: #fff; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Barre de navigation dynamique et intelligente -->
    {% include 'navbar.html' %}

    <!-- Contenu dynamique des différentes vues -->
    <div class="container">
        {% block content %}
        <!-- Le contenu des autres pages s'insère ici -->
        {% endblock %}
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
